<script>
const CFG = window.GACHA_CONFIG;
const TIERS = ['apex','mythic','legendary','epic','rare','uncommon','common'];
const TIER_POINTS = {apex:10000,mythic:3000,legendary:1000,epic:300,rare:100,uncommon:30,common:10};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');

let sb = null;
if (window.supabase && !/PASTE/.test(CFG.SUPABASE_URL)) sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);

// ---------------- state ----------------
const S = {
  token: localStorage.getItem('gacha_token'),
  me: null,              // state from get_state
  levels: [], byKey: {}, packs: [],
  myCards: [],           // [{id, level_key, holo}]
  board: [], clock: 0,   // server - client ms
  filter: {show:'all', tier:'all'},
  trade: {to:null, give:new Set(), get:new Set(), theirCards:[]},
  incoming: 0
};

async function rpc(name, args) {
  const { data, error } = await sb.rpc(name, args);
  if (error) {
    if (/Not logged in/.test(error.message)) { logoutLocal(); throw new Error('Please log in again'); }
    throw new Error(error.message);
  }
  return data;
}
async function fetchAll(q) {   // Supabase returns max 1000 rows per request
  let out = [], from = 0;
  while (true) {
    const { data, error } = await q().range(from, from + 999);
    if (error) throw new Error(error.message);
    out = out.concat(data);
    if (data.length < 1000) return out;
    from += 1000;
  }
}
function toast(msg, bad) {
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}

// summarize a card list -> {key: {count, holo}}
function ownership(cards) {
  const o = {};
  for (const c of cards) { const x = o[c.level_key] ||= {count:0, holo:0, ids:[]}; x.count++; if (c.holo) x.holo++; x.ids.push(c.id); }
  return o;
}

let opening = false;
async function openPacks(kind, count) {
  if (opening) return; opening = true;
  const top = document.querySelector('.stack .pack:last-child');
  if (top && kind === 'normal') top.classList.add('tearing');
  document.querySelectorAll('main button').forEach(b => b.disabled = true);
  let r;

  catch (e) { opening = false; toast(e.message, true); renderHome(); return; }
  setState(r.state);
  r.cards.forEach(c => S.myCards.push({id: c.id, level_key: c.level_key, holo: c.holo}));
  opening = false;
  showOpening(kind, r.cards);
  rpc('leaderboard').then(b => S.board = b).catch(() => {});
}
function showOpening(kind, cards) {
  const lv = c => S.byKey[c.level_key];
  const ti = c => TIERS.indexOf(lv(c).tier);             // 0 = apex … 6 = common
  const multi = cards.length > S.me.cards_per_pack;
  // single pack: reveal worst → best so the best card comes last; many packs: list order
  const order = multi ? [...cards].sort((a, b) => (lv(a).rank ?? 999) - (lv(b).rank ?? 999))
                      : [...cards].sort((a, b) => ti(b) - ti(a) || (lv(b).rank ?? 0) - (lv(a).rank ?? 0));
  const best = [...cards].sort((a, b) => (lv(a).rank ?? 999) - (lv(b).rank ?? 999) || b.holo - a.holo)[0], bl = lv(best);
  const newCount = cards.filter(c => c.is_new || c.is_new_holo).length;
  const counts = {}; cards.forEach(c => counts[lv(c).tier] = (counts[lv(c).tier] || 0) + 1);
  const holoN = cards.filter(c => c.holo).length;
  const left = () => kind === 'normal' ? S.me.packs + S.me.bonus_packs : kind === 'epic' ? S.me.epic_packs : S.me.legendary_packs;
  const tc = t => `var(--${t === 'apex' ? 'accent2' : t})`;
  const ov = document.createElement('div'); ov.className = 'overlay';
  const cols = multi ? '' : `style="grid-template-columns:repeat(${order.length},minmax(0,200px));justify-content:center"`;
  ov.innerHTML = `<div class="inner">
    <h1 id="ovTitle">${multi ? `Opening ${cards.length / S.me.cards_per_pack} packs…` : `Opening ${kind === 'normal' ? '' : kind + ' '}pack…`}</h1>
    <div id="ovSum" style="opacity:0;transition:opacity .4s">
      <div class="muted" style="font-size:17px">Best pull: <b style="color:${tc(bl.tier)}">${bl.tier.toUpperCase()}</b> #${bl.rank ?? '—'} ${esc(bl.name)}${best.holo ? ' ✦ holo' : ''} · ✓ saved to your collection</div>
      ${multi ? `<div class="tiersum">${TIERS.filter(t => counts[t]).map(t => `<span style="color:${tc(t)}">${t.toUpperCase()} ×${counts[t]}</span>`).join('')}</div>` : ''}
      ${holoN && multi ? `<div class="holosum">✦ HOLO ×${holoN}</div>` : ''}
      <div style="color:#6ee08c;font-weight:900;font-size:20px;margin-top:10px">${newCount ? `✦ ${newCount} new for your collection` : 'No new cards this time'}</div>
    </div>
    <div class="grid revealgrid" ${cols}>${order.map((c, i) => { const l = lv(c); return `<div class="cell deal t-${l.tier}" style="animation-delay:${Math.min(i, 30) * (multi ? 25 : 120)}ms">
      <div class="flip t-${l.tier}" data-i="${i}"><div class="flip-in">
        <div class="front">${cardHTML(l, {holo: c.holo, meta: !multi})}</div>
        <div class="cback"><div class="em">GD</div></div>
      </div></div>
      <div class="under">${c.is_new_holo && !c.is_new ? '<div class="newb">✦ NEW HOLO</div>' : c.is_new ? `<div class="newb">✦ NEW${c.holo ? ' HOLO' : ''}</div>` : `<div class="tierlbl" style="--c:${tc(l.tier)}">${l.tier.toUpperCase()}</div>`}</div>
    </div>`; }).join('')}</div>
  </div>
  <div class="actions" id="ovAct"><button class="btn light" id="revAll">Reveal all</button></div>`;
  document.body.appendChild(ov);
  const flips = [...ov.querySelectorAll('.flip')];
  let skip = false, done = false;
  const flip = f => { f.classList.remove('charge'); f.classList.add('open'); f.parentElement.classList.add('opened'); };
  const finish = () => {
    if (done) return; done = true;
    flips.forEach(flip);
    ov.querySelector('#ovTitle').textContent = multi ? `${cards.length / S.me.cards_per_pack} packs opened!` : 'Pack opened!';
    ov.querySelector('#ovSum').style.opacity = 1;
    const n = left();
    ov.querySelector('#ovAct').innerHTML = `${n ? `<button class="btn primary" id="again">Open another (${n} left)</button>` : ''}
      ${n > 1 && kind === 'normal' ? `<button class="btn light" id="againAll">Open all (${n})</button>` : ''}
      <button class="btn light" id="toCol">View collection</button><button class="btn light" id="cont">Continue</button>`;
    const close = () => ov.remove();
    ov.querySelector('#cont').onclick = () => { close(); route(); };
    ov.querySelector('#toCol').onclick = () => { close(); go('#/collection'); route(); };
    if (n) ov.querySelector('#again').onclick = () => { close(); renderHome(); openPacks(kind, 1); };
    if (ov.querySelector('#againAll')) ov.querySelector('#againAll').onclick = () => { close(); renderHome(); openPacks(kind, n); };
  };
  flips.forEach(f => f.onclick = () => { flip(f); if (flips.every(x => x.classList.contains('open'))) finish(); });
  ov.querySelector('#revAll').onclick = () => { skip = true; finish(); };
  (async () => {
    await sleep(multi ? 500 : order.length * 120 + 500);
    for (const f of flips) {
      if (skip || done) return;
      if (f.classList.contains('open')) continue;
      const t = TIERS.indexOf([...f.classList].find(c => c.startsWith('t-')).slice(2));
      if (t <= 3 && !multi) { f.classList.add('charge'); await sleep(1100); }   // Epic or better: glow first
      if (skip || done) return;
      flip(f); await sleep(multi ? 45 : 520);
    }
    await sleep(500); finish();
  })();
}

// ---------------- collection ----------------
function collectionGrid(cards, opts = {}) {
  const own = ownership(cards);
  const f = S.filter;
  let lv = S.levels.filter(l => l.rank || own[l.key]);
  if (f.tier !== 'all') lv = lv.filter(l => l.tier === f.tier);
  if (f.show === 'owned') lv = lv.filter(l => own[l.key]);
  if (f.show === 'missing') lv = lv.filter(l => !own[l.key]);
  if (f.show === 'holo') lv = lv.filter(l => own[l.key] && own[l.key].holo);
  if (f.show === 'dupes') lv = lv.filter(l => own[l.key] && own[l.key].count > 1);
  if (opts.ownedOnly) lv = lv.filter(l => own[l.key]);
  return lv.length ? `<div class="grid">${lv.map(l => cardHTML(l, {
      missing: !own[l.key], holo: own[l.key] && own[l.key].holo,
      count: own[l.key] && own[l.key].count > 1 ? `×${own[l.key].count}` : ''
    })).join('')}</div>` : '<p class="muted">Nothing here.</p>';
}
function rewardKind(keys) { return keys.some(k => ['apex','mythic','legendary'].includes(S.byKey[k]?.tier)) ? 'legendary' : 'epic'; }
// Mirrors the leaderboard formula in the database
function scoreInfo(cards, claimed) {
  const own = ownership(cards);
  claimed = claimed || (S.me ? S.me.claimed_sets || [] : []);
  const byTier = {}; let base = 0, holoBonus = 0;
  for (const [k, o] of Object.entries(own)) {
    const l = S.byKey[k]; if (!l) continue;
    const p = TIER_POINTS[l.tier];
    const t = byTier[l.tier] ||= {n: 0, pts: 0, holo: 0};
    t.n++; t.pts += p; base += p;
    if (o.holo) { t.holo++; holoBonus += p * 2; }
  }
  const sets = S.packs.map(p => {
    const missing = p.level_keys.filter(k => !own[k]);
    const bonus = Math.floor(p.level_keys.reduce((s, k) => s + (S.byKey[k] ? TIER_POINTS[S.byKey[k].tier] : 0), 0) / 2);
    return {p, have: p.level_keys.length - missing.length, missing, done: !missing.length, bonus, reward: rewardKind(p.level_keys), claimed: claimed.includes(p.name)};
  });
  sets.sort((a, b) => (b.done && !b.claimed) - (a.done && !a.claimed) || a.done - b.done || a.missing.length - b.missing.length || b.bonus - a.bonus);
  const setBonus = sets.filter(x => x.done).reduce((s, x) => s + x.bonus, 0);
  return {byTier, base, holoBonus, setBonus, setsDone: sets.filter(x => x.done).length, total: base + holoBonus + setBonus, sets};
}
function scoreTable(info) {
  const rows = TIERS.filter(t => info.byTier[t]).map(t => {
    const x = info.byTier[t];
    return `<tr><td><span style="color:var(--${t === 'apex' ? 'accent2' : t});font-weight:800">${t.toUpperCase()}</span></td><td>${x.n} level${x.n > 1 ? 's' : ''} × ${TIER_POINTS[t].toLocaleString()}</td><td style="text-align:right">${x.pts.toLocaleString()}</td></tr>`;
  }).join('');
  return `<table class="scoretbl"><tbody>${rows || '<tr><td class="muted" colspan="3">No cards yet. Open a pack!</td></tr>'}
    <tr><td><b>✦ Holo bonus</b></td><td class="muted">holo levels count 3×</td><td style="text-align:right">+${info.holoBonus.toLocaleString()}</td></tr>
    <tr><td><b>Set bonuses</b></td><td class="muted">${info.setsDone} of ${S.packs.length} sets complete</td><td style="text-align:right">+${info.setBonus.toLocaleString()}</td></tr>
    <tr class="tot"><td><b>Total</b></td><td class="muted">dupes don't count, trade them!</td><td style="text-align:right"><b>${info.total.toLocaleString()}</b></td></tr>
  </tbody></table>`;
}
function setCards(sets, readOnly) {
  if (!sets.length) return '<p class="muted">No sets.</p>';
  return `<div class="sets">${sets.map(x => {
    const n = x.p.level_keys.length, away = x.missing.length;
    const status = x.done ? (x.claimed || readOnly ? '<span class="sdone">✓ Complete</span>' : `<button class="btn primary sm" data-claim="${esc(x.p.name)}">Claim reward</button>`)
      : `<span class="saway">${away === 1 ? '1 level away!' : `${away} levels away`}</span>`;
    return `<div class="setbox ${x.done ? 'done' : ''}" style="--sc:${esc(x.p.colour || '#888')}">
      <div class="row" style="justify-content:space-between"><b>${esc(x.p.name)}</b><span class="muted">${x.have}/${n}</span></div>
      <div class="bar" style="margin:8px 0"><i style="width:${x.have / n * 100}%;background:var(--sc)"></i></div>
      <div class="slv">${x.p.level_keys.map(k => { const l = S.byKey[k]; const has = !x.missing.includes(k);
        return `<span class="${has ? 'has' : ''}">${has ? '✓' : '○'} ${esc(l?.name || k)}${l?.rank ? ` <i>#${l.rank}</i>` : ''}</span>`; }).join('')}</div>
      <div class="srew">Reward: <b>+${x.bonus.toLocaleString()} pts</b> & <b class="${x.reward}">1 ${x.reward === 'legendary' ? 'Legendary' : 'Epic'} pack</b>${x.claimed ? ' <span class="muted">(pack claimed)</span>' : ''}</div>
      <div style="margin-top:8px">${status}</div></div>`;
  }).join('')}</div>`;
}
function bindClaims() {
  document.querySelectorAll('[data-claim]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const r = await rpc('claim_set', {p_token: S.token, p_set_name: b.dataset.claim}); setState(r.state); toast(`Set complete! +1 ${r.kind} pack`); route(); }
    catch (e) { toast(e.message, true); b.disabled = false; }
  });
}
function filterChips(rerender) {
  const f = S.filter;
  const chip = (grp, v, label) => `<button class="chip ${f[grp] === v ? 'on' : ''}" data-g="${grp}" data-v="${v}">${label}</button>`;
  setTimeout(() => document.querySelectorAll('.chip[data-g]').forEach(b => b.onclick = () => { S.filter[b.dataset.g] = b.dataset.v; rerender(); }));
  return `<div class="chips">${chip('show','all','All')}${chip('show','owned','Owned')}${chip('show','missing','Missing')}${chip('show','holo','✦ Holo')}${chip('show','dupes','Dupes')}</div>
    <div class="chips">${chip('tier','all','Every tier')}${TIERS.map(t => chip('tier', t, t[0].toUpperCase() + t.slice(1))).join('')}</div>`;
}
function renderCollection() {
  const listed = S.levels.filter(l => l.rank), own = ownership(S.myCards);
  app.innerHTML = `<div class="panel"><h2>Your collection · ${listed.filter(l => own[l.key]).length}/${listed.length} · ${S.myCards.length} cards total</h2>
    ${filterChips(renderCollection)}${collectionGrid(S.myCards)}</div>
    <div class="panel"><h2>GDPS pack sets</h2><p class="muted" style="margin-top:-6px">Own every level in a set (normal or holo) to earn its bonus points, plus a one-time reward pack.</p>${setCards(scoreInfo(S.myCards).sets)}</div>
    <div class="panel"><h2>Your score</h2>${scoreTable(scoreInfo(S.myCards))}</div>`;
  bindClaims();
}

// ---------------- leaderboard / players ----------------
async function renderBoard() {
  app.innerHTML = `<div class="panel"><h2>Leaderboard</h2><p class="muted" style="margin-top:-6px">Score = each level you own once (holo counts 3×) + GDPS pack set bonuses. Dupes don't count, so trade them.</p><div id="lb">Loading…</div></div>`;
  S.board = await rpc('leaderboard');
  const n = S.levels.filter(l => l.rank).length;
  $('#lb').innerHTML = `<table><thead><tr><th>#</th><th>Player</th><th>Score</th><th>Unique</th><th>Holo</th><th>Sets</th></tr></thead><tbody>
    ${S.board.map((r, i) => `<tr class="${r.user_id === S.me.user_id ? 'me' : ''}" data-u="${esc(r.username)}"><td><b>${i + 1}</b></td><td><b>${esc(r.username)}</b></td><td>${r.score.toLocaleString()}</td><td>${r.uniq}/${n}</td><td>${r.holos}</td><td>${r.packs_done}/${S.packs.length}</td></tr>`).join('')}
  </tbody></table>`;
  document.querySelectorAll('tr[data-u]').forEach(tr => tr.onclick = () => go('#/player/' + encodeURIComponent(tr.dataset.u)));
}
async function renderPlayer(name) {
  if (!S.board.length) S.board = await rpc('leaderboard');
  const row = S.board.find(r => r.username.toLowerCase() === name.toLowerCase());
  if (!row) { app.innerHTML = '<div class="panel">Player not found.</div>'; return; }
  app.innerHTML = '<div class="panel">Loading…</div>';
  const cards = await cardsOf(row.user_id);
  const draw = () => {
    app.innerHTML = `<div class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(row.username)} · ${row.score.toLocaleString()} pts</h2>
      ${row.user_id !== S.me.user_id ? `<button class="btn primary sm" id="tw">Trade with ${esc(row.username)}</button>` : ''}</div><br>
      ${filterChips(draw)}${collectionGrid(cards)}</div>
      <div class="panel"><h2>GDPS pack sets</h2>${setCards(scoreInfo(cards, []).sets, true)}</div>`;
    const tw = $('#tw'); if (tw) tw.onclick = () => go('#/trades/new/' + encodeURIComponent(row.username));
  };
  draw();
}

// ---------------- trades ----------------
async function renderTrades() {
  app.innerHTML = `<div class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Trades</h2>
    <div class="row"><select class="field" id="pickP"><option value="">Trade with…</option></select><button class="btn primary sm" id="newT">New trade</button></div></div>
    <p class="muted">Both players must agree. Trades are final, so check the cards before accepting.</p><div id="tl">Loading…</div></div>`;
  if (!S.board.length) S.board = await rpc('leaderboard');
  $('#pickP').innerHTML += S.board.filter(r => r.user_id !== S.me.user_id).map(r => `<option>${esc(r.username)}</option>`).join('');
  $('#newT').onclick = () => { const v = $('#pickP').value; if (v) go('#/trades/new/' + encodeURIComponent(v)); else toast('Pick a player first', true); };
  const list = await rpc('my_trades', {p_token: S.token});
  updateTradeDot(list);
  const mini = arr => arr.length ? `<div class="grid">${arr.map(c => cardHTML(S.byKey[c.level_key], {holo: c.holo, small: true, meta: false})).join('')}</div>` : '<span class="muted">nothing</span>';
  $('#tl').innerHTML = list.length ? list.map(t => {
    const youGive = t.incoming ? t.request : t.offer, youGet = t.incoming ? t.offer : t.request;
    const other = t.incoming ? t.from_username : t.to_username;
    return `<div class="trade"><div class="row" style="justify-content:space-between">
      <b>${t.incoming ? `From ${esc(other)}` : `To ${esc(other)}`}</b><span class="status ${t.status}">${t.status}</span></div>
      <div class="sides"><div><div class="label">You give</div>${mini(youGive)}</div><div><div class="label">You get</div>${mini(youGet)}</div></div>
      ${t.status === 'pending' ? `<div class="row">${t.incoming ? `<button class="btn primary sm" data-acc="${t.id}">Accept</button><button class="btn sm" data-dec="${t.id}">Decline</button>` : `<span class="muted">Waiting for ${esc(other)}…</span><button class="btn sm" data-dec="${t.id}">Cancel</button>`}</div>` : ''}
    </div>`;
  }).join('') : '<p class="muted">No trades yet.</p>';
  document.querySelectorAll('[data-acc],[data-dec]').forEach(b => b.onclick = async () => {
    const acc = !!b.dataset.acc, id = +(b.dataset.acc || b.dataset.dec);
    if (acc && !confirm('Accept this trade? It can\'t be undone.')) return;
    b.disabled = true;
    try {
      const r = await rpc('respond_trade', {p_token: S.token, p_trade_id: id, p_accept: acc});
      if (r.ok === false) toast(r.message, true); else toast('Trade ' + r.status);
      await loadMyCards(); renderTrades();
    } catch (e) { toast(e.message, true); b.disabled = false; }
  });
}
function updateTradeDot(list) {
  const n = list.filter(t => t.incoming && t.status === 'pending').length;
  S.incoming = n;
  $('#navTrades').innerHTML = 'Trades' + (n ? `<span class="dot">${n}</span>` : '');
}
async function renderNewTrade(name) {
  if (!S.board.length) S.board = await rpc('leaderboard');
  const row = S.board.find(r => r.username.toLowerCase() === name.toLowerCase());
  if (!row || row.user_id === S.me.user_id) { app.innerHTML = '<div class="panel">Player not found.</div>'; return; }
  app.innerHTML = '<div class="panel">Loading…</div>';
  const theirs = await cardsOf(row.user_id);
  const give = new Set(), get = new Set();
  const myOwn = ownership(S.myCards), theirOwn = ownership(theirs);
  const sortCards = arr => [...arr].sort((a, b) => (S.byKey[a.level_key].rank ?? 999) - (S.byKey[b.level_key].rank ?? 999) || a.holo - b.holo);
  const pick = (arr, sel, ownMap, otherOwn) => `<div class="grid">${sortCards(arr).map(c => {
    const o = ownMap[c.level_key];
    const tagTxt = o.count > 1 ? 'dupe' : '';
    const needs = otherOwn && !otherOwn[c.level_key] ? '★' : '';
    return cardHTML(S.byKey[c.level_key], {id: c.id, holo: c.holo, small: true, meta: false, sel: sel.has(c.id), count: [tagTxt, needs].filter(Boolean).join(' ')});
  }).join('')}</div>`;
  const draw = () => {
    app.innerHTML = `<div class="panel"><h2>New trade with ${esc(row.username)}</h2>
      <p class="muted" style="margin-top:-6px">Tap cards to select. ★ = the other player doesn't own that level yet.</p>
      <div class="two">
        <div><h3>You give (${give.size})</h3><div class="picker" id="pg">${pick(S.myCards, give, myOwn, theirOwn)}</div></div>
        <div><h3>You get (${get.size})</h3><div class="picker" id="pt">${pick(theirs, get, theirOwn, myOwn)}</div></div>
      </div><br>
      <div class="row"><button class="btn primary" id="send" ${give.size + get.size ? '' : 'disabled'}>Send trade offer</button><a href="#/trades">Back</a></div></div>`;
    const bind = (el, set) => el.querySelectorAll('.card').forEach(c => c.onclick = () => {
      const id = +c.dataset.id; set.has(id) ? set.delete(id) : set.add(id);
      const y1 = $('#pg').scrollTop, y2 = $('#pt').scrollTop; draw(); $('#pg').scrollTop = y1; $('#pt').scrollTop = y2;
    });
    bind($('#pg'), give); bind($('#pt'), get);
    $('#send').onclick = async () => {
      $('#send').disabled = true;
      try { await rpc('create_trade', {p_token: S.token, p_to_username: row.username, p_offer: [...give], p_request: [...get]}); toast('Trade offer sent!'); go('#/trades'); }
      catch (e) { toast(e.message, true); $('#send').disabled = false; }
    };
  };
  draw();
}

// ---------------- admin ----------------
function renderAdmin() {
  if (!S.me.is_admin) { go('#/'); return; }
  app.innerHTML = `<div class="panel"><h2>Admin</h2>
    <h3>Sync with the demonlist</h3>
    <p class="muted">Pulls the current list and packs from the GDPS demonlist GitHub. New levels get added, ranks and tiers update, and removed levels become "vaulted" (people keep their cards, but they stop dropping).</p>
    <button class="btn primary" id="sync">Sync now</button> <span id="syncMsg" class="muted"></span>
    <hr style="border-color:var(--line);margin:24px 0">
    <h3>Create a code</h3>
    <div class="row"><input class="field" id="cCode" placeholder="CODE"><input class="field" id="cPacks" type="number" value="3" style="width:80px">
      <select class="field" id="cKind"><option value="normal">normal packs</option><option value="epic">epic packs</option><option value="legendary">legendary packs</option></select>
      <input class="field" id="cUses" type="number" value="100" style="width:90px" title="max uses"><button class="btn sm" id="cGo">Create</button></div>
    <p class="muted" style="font-size:13px">The last box is the max number of people who can use it.</p>
    <hr style="border-color:var(--line);margin:24px 0">
    <h3>Reset someone's PIN</h3>
    <div class="row"><input class="field" id="rUser" placeholder="username"><input class="field" id="rPin" placeholder="new PIN" maxlength="4"><button class="btn sm" id="rGo">Reset</button></div>
  </div>`;
  $('#sync').onclick = async () => {
    $('#sync').disabled = true; const msg = $('#syncMsg');
    try {
      msg.textContent = 'Downloading list…';
      const base = CFG.LIST_REPO_RAW;
      const list = await (await fetch(base + '_list.json', {cache: 'no-store'})).json();
      const packs = await (await fetch(base + '_packlist.json', {cache: 'no-store'})).json();
      const vid = u => { const m = String(u || '').match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : null; };
      const levels = [];
      for (let i = 0; i < list.length; i += 10) {
        msg.textContent = `Downloading levels ${i + 1}–${Math.min(i + 10, list.length)} of ${list.length}…`;
        const chunk = await Promise.all(list.slice(i, i + 10).map(async k => {
          const d = await (await fetch(base + encodeURIComponent(k) + '.json', {cache: 'no-store'})).json();
          return {key: k, name: d.name, author: d.author, verifier: d.verifier, video_id: vid(d.verification)};
        }));
        levels.push(...chunk);
      }
      const r = await rpc('admin_sync', {p_token: S.token, p_levels: levels, p_packs: packs.map(p => ({name: p.name, colour: p.colour, levels: p.levels}))});
      await loadLevels();
      msg.textContent = `Done: ${r.levels} levels, ${r.packs} packs.`;
    } catch (e) { msg.textContent = 'Failed: ' + e.message; }
    $('#sync').disabled = false;
  };
  $('#cGo').onclick = async () => {
    try { await rpc('admin_create_code', {p_token: S.token, p_code: $('#cCode').value, p_packs: +$('#cPacks').value, p_kind: $('#cKind').value, p_max_uses: +$('#cUses').value}); toast('Code created: ' + $('#cCode').value.toUpperCase()); }
    catch (e) { toast(e.message, true); }
  };
  $('#rGo').onclick = async () => {
    try { await rpc('admin_reset_pin', {p_token: S.token, p_username: $('#rUser').value, p_new_pin: $('#rPin').value}); toast('PIN reset'); }
    catch (e) { toast(e.message, true); }
  };
}

// ---------------- router / boot ----------------
async function route() {
  if (!S.me) return;
  document.querySelectorAll('.modal').forEach(m => m.remove());
  const h = location.hash || '#/';
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === h || (h.startsWith('#/trades') && a.id === 'navTrades')));
  try {
    if (h.startsWith('#/collection')) renderCollection();
    else if (h.startsWith('#/leaderboard')) await renderBoard();
    else if (h.startsWith('#/player/')) await renderPlayer(decodeURIComponent(h.slice(9)));
    else if (h.startsWith('#/trades/new/')) await renderNewTrade(decodeURIComponent(h.slice(13)));
    else if (h.startsWith('#/trades')) await renderTrades();
    else if (h.startsWith('#/admin')) renderAdmin();
    else renderHome();
  } catch (e) { app.innerHTML = `<div class="panel">Something went wrong: ${esc(e.message)}</div>`; }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
$('#packPill').onclick = () => go('#/');

async function boot() {
  if (!sb) {
    app.innerHTML = `<div class="panel auth"><h2>Almost there</h2><p>Open <b>index.html</b> and paste your Supabase Project URL and anon key into the CONFIG section at the top.</p></div>`;
    return;
  }
  if (!S.token) { renderAuth(); return; }
  app.innerHTML = '<div class="panel" style="text-align:center">Loading…</div>';
  try {
    await refreshState();
    await Promise.all([loadLevels(), loadMyCards(), rpc('leaderboard').then(b => S.board = b)]);
  } catch (e) {
    if (!S.token) { renderAuth(); return; }
    app.innerHTML = `<div class="panel">Couldn't connect: ${esc(e.message)}</div>`; return;
  }
  $('#top').classList.remove('hidden');
  route();
  rpc('my_trades', {p_token: S.token}).then(updateTradeDot).catch(() => {});
}
// check for new trade offers every 30s
setInterval(() => { if (S.token && S.me) rpc('my_trades', {p_token: S.token}).then(updateTradeDot).catch(() => {}); }, 30000);
boot();
</script>
