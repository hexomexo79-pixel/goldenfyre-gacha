<style>
:root{
  --bg:#0a0909; --panel:#141317; --panel2:#1b1a20; --line:#2a2830; --text:#f2f0f5; --muted:#9c98a6;
  --accent:#ff7a59; --accent2:#ffb340;
  --common:#9aa0a8; --uncommon:#3fca6b; --rare:#3f82f0; --epic:#a463f2; --legendary:#f5a524; --mythic:#e5484d; --apex:#ffd36b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(1200px 600px at 50% -200px,#3a0f12 0%,transparent 70%),var(--bg);min-height:100vh}
a{color:var(--accent2)}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(8,8,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-weight:900;letter-spacing:.5px;font-size:18px;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo img{width:30px;height:30px}
nav{display:flex;gap:4px;margin-left:12px;flex-wrap:wrap}
nav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;font-weight:600;font-size:14px;position:relative}
nav a.on,nav a:hover{color:var(--text);background:var(--panel2)}
.dot{position:absolute;top:0;right:0;min-width:16px;height:16px;border-radius:8px;background:#ff3b6b;color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;cursor:pointer}
.pill img{width:18px;height:18px}
.user{color:var(--muted);font-size:14px;cursor:pointer}
@media (max-width:760px){nav{order:3;width:100%;margin:0}.top{flex-wrap:wrap}}

main{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
h2{font-size:20px;margin:0 0 14px}
h3{margin:0 0 10px;font-size:16px}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 18px;border-radius:12px;font-weight:700}
.btn:hover{border-color:#444}
.btn.primary{background:linear-gradient(90deg,#ff6b6b,#ffb340);color:#1a0d05;border:none}
.btn.epic{background:linear-gradient(90deg,#7c3aed,#c084fc);color:#fff;border:none}
.btn.leg{background:linear-gradient(90deg,#d97706,#fcd34d);color:#2a1600;border:none}
.btn.light{background:#f4f2f6;color:#111;border:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.field{background:#0d0c10;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;min-width:0}
.banner{background:linear-gradient(90deg,rgba(255,107,107,.15),rgba(255,179,64,.15));border:1px solid #6b4a1f;border-radius:12px;padding:12px 16px;margin-bottom:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* pack panel */
.packs{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:20px;align-items:center}
@media (max-width:820px){.packs{grid-template-columns:1fr}}
.big{font-size:56px;font-weight:900;line-height:1}
.big small{font-size:22px;color:var(--muted);font-weight:700}
.label{font-size:12px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;font-weight:700}
.stack{position:relative;height:262px;display:flex;justify-content:center;margin-bottom:14px}
.pack{position:absolute;top:14px;width:150px;height:226px;color:#fff;text-align:center;border-radius:4px;overflow:hidden;
  background:linear-gradient(165deg,#3a0b12 0%,#8f1524 38%,#e0453a 72%,#ffb35c 100%);
  box-shadow:0 14px 30px rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;transform-origin:bottom center;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/8px 51% repeat-x,conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/8px 51% repeat-x;
          mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/8px 51% repeat-x,conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/8px 51% repeat-x}
.pack::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 48%,transparent 60%);background-size:300% 100%;animation:shine 4.5s ease-in-out infinite;z-index:2}
.pack::after{content:"";position:absolute;inset:10px 8px;border:1px solid rgba(255,255,255,.22);border-radius:3px}
@keyframes shine{0%,55%{background-position:120% 0}100%{background-position:-60% 0}}
.pack.epic{background:linear-gradient(165deg,#140b2e,#3b1a8a 40%,#8b5cf6 75%,#e9d5ff)}
.pack.legendary{background:linear-gradient(165deg,#2a1500,#8a4b06 40%,#f59e0b 75%,#fff1b8)}
.pack .pk-face{width:70px;height:70px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.pack .pk-title{font-weight:900;font-size:22px;margin-top:10px;letter-spacing:2px;line-height:1}
.pack .pk-kind{font-size:11px;letter-spacing:3px;opacity:.85;margin-top:4px;font-weight:700}
.pack .pk-sub{margin-top:12px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 12px;font-weight:800;font-size:10px;letter-spacing:2px}
.pack.empty{opacity:.25;filter:grayscale(1)}
.pack.mini{position:relative;top:0;width:46px;height:68px;flex:none}.pack.mini::after{inset:5px 4px}.pack.mini img{width:30px;height:30px;position:relative}
.full{border:1px solid #b7791f;color:#f6c063;border-radius:999px;padding:8px 18px;font-weight:800;font-size:13px;display:inline-block;letter-spacing:.5px}
.special{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media (max-width:600px){.special{grid-template-columns:1fr}}
.spbox{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{font-size:26px;display:block}
.bar{height:6px;background:#26242c;border-radius:4px;overflow:hidden;margin:6px 0 14px;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff6b6b,#ffb340)}
.bar .mark{position:absolute;top:0;bottom:0;width:2px;background:#fff8}

/* cards (tall, 5:7) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px}
.hscroll .card{flex:0 0 150px}
.card{--c:var(--common);position:relative;aspect-ratio:5/7;border-radius:11px;padding:9px;background:linear-gradient(180deg,#1c1b21,#131217);
  border:2px solid var(--c);box-shadow:0 4px 14px rgba(0,0,0,.45);display:flex;flex-direction:column;cursor:pointer;overflow:hidden;isolation:isolate;container-type:inline-size}
.card.t-common{--c:var(--common)}.card.t-uncommon{--c:var(--uncommon)}.card.t-rare{--c:var(--rare)}
.card.t-epic{--c:var(--epic)}.card.t-legendary{--c:var(--legendary)}.card.t-mythic{--c:var(--mythic)}
.card.t-apex{--c:var(--apex);border-color:transparent;background:linear-gradient(#18171c,#18171c) padding-box,linear-gradient(135deg,#ff4d4d,#ffb340,#3fca6b,#3f82f0,#a463f2,#ff4d4d) border-box}
.card .ctop{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:7px}
.card .rank{font-weight:900;font-size:clamp(11px,11cqw,17px)}
.tag{font-size:clamp(7px,6.5cqw,10px);font-weight:800;letter-spacing:.4px;padding:2px 5px;border-radius:5px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);text-transform:uppercase;white-space:nowrap}
.thumb{aspect-ratio:16/10;border-radius:7px;overflow:hidden;background:#0c0b0f;border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{font-weight:900;font-size:12px;text-align:center;padding:6px;color:var(--c);background:radial-gradient(circle,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%);width:100%;height:100%;display:grid;place-items:center}
.card .nm{font-weight:800;font-size:clamp(11px,10cqw,16px);margin-top:9px;line-height:1.15;overflow-wrap:break-word}
.card .meta{font-size:clamp(9px,7.5cqw,11px);color:var(--muted);margin-top:auto;line-height:1.35}
.card .meta{margin-bottom:calc(1.9em + 6px)}
.card .pts{position:absolute;left:9px;right:9px;bottom:8px;text-align:center;font-size:clamp(9px,8.5cqw,13px);font-weight:900;color:var(--c);z-index:2;
  background:color-mix(in srgb,var(--c) 14%,#000);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:6px;padding:2px 0}
.card .holotag{position:absolute;left:14px;top:calc(9px + 1.6em + 7px);background:#f2eefc;color:#2b1a5a;font-weight:900;font-size:clamp(8px,7cqw,11px);border-radius:6px;padding:1px 6px;z-index:4}
.card.holo::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;mix-blend-mode:color;opacity:.55;
  background:linear-gradient(125deg,#ff6b6b,#ffd36b,#6bff9c,#6bd0ff,#b46bff,#ff6bd0);animation:hue 7s linear infinite}
.card.holo::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 45%,rgba(255,255,255,.05) 55%,transparent 70%);background-size:300% 100%;animation:shine 5s ease-in-out infinite}
.card.holo{box-shadow:0 0 16px color-mix(in srgb,var(--c) 35%,transparent)}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.card.missing{filter:grayscale(1) brightness(.42)}
.card.missing .thumb img{opacity:.35}
.card.sel{outline:3px solid #fff;outline-offset:2px}
.card.mini{padding:5px;border-radius:7px;border-width:2px}
.card.mini .ctop{margin-bottom:4px}.card.mini .tag,.card.mini .meta,.card.mini .pts,.card.mini .holotag{display:none}.card.mini .nm{margin-top:5px}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px;margin:8px 0}

/* stacks of copies */
.cstack{position:relative}
.cstack .layer{position:absolute;left:0;right:0;transition:transform .25s ease}
.cstack .layer .card{box-shadow:0 -2px 8px rgba(0,0,0,.6)}
.cstack .front{position:relative}
.cstack .many{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);z-index:30;background:#f2eef6;color:#111;font-weight:900;font-size:18px;border-radius:10px;padding:2px 12px;box-shadow:0 4px 12px rgba(0,0,0,.6)}
.cstack .cnt{position:absolute;right:-6px;bottom:-8px;z-index:30;background:#000c;border:1px solid var(--line);font-weight:900;font-size:12px;border-radius:8px;padding:1px 7px}
/* trade stacks: hover a layer to slide it out */
.tstack .layer,.tstack .front{transition:transform .22s ease}
.tstack .peek{transform:translateX(42%) rotate(4deg)!important;z-index:40!important}
.tstack .hit{position:absolute;left:0;right:0;z-index:45;cursor:pointer}
.tray{min-height:120px;border:1px dashed #3a3842;border-radius:12px;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;align-content:start}
.tray .card{cursor:pointer}
.tray:empty::before{content:"Click cards below to add them";color:var(--muted);font-size:13px;grid-column:1/-1;align-self:center;text-align:center}
.tradecols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.tradecols{grid-template-columns:1fr}}
.tpick{max-height:560px;overflow-y:auto;padding:10px 4px 20px}
.tpick .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));row-gap:22px}

/* overlay / pick */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,4,6,.95);overflow-y:auto;padding:24px 16px 130px}
.overlay .inner{max-width:900px;margin:0 auto;text-align:center}
.overlay h1{margin:6px 0}
.pickrow{display:grid;grid-template-columns:repeat(3,minmax(0,210px));justify-content:center;gap:18px;margin-top:20px;text-align:left}
@media (max-width:600px){.pickrow{gap:8px}}
.deal{animation:deal .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes deal{from{transform:translateY(60px) scale(.85);opacity:0}to{transform:none;opacity:1}}
.flip{perspective:1100px;position:relative}
.flip-in{position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.25,.4,1);transform:rotateY(180deg)}
.flip.open .flip-in{transform:rotateY(0)}
.flip .fr{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cback{position:absolute;inset:0;transform:rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:11px;cursor:pointer;
  background:radial-gradient(circle at 50% 45%,#5a1019 0%,#26070b 70%);border:2px solid #6e1a22;display:grid;place-items:center;overflow:hidden}
.cback::before{content:"";position:absolute;inset:8px;border:1px solid rgba(255,140,120,.25);border-radius:7px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 6px,transparent 6px 12px)}
.cback img{position:relative;width:46%;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.flip.charge .cback{animation:charge 1s ease-in-out infinite;--g:var(--epic)}
.flip.charge.t-legendary .cback{--g:var(--legendary)}.flip.charge.t-mythic .cback{--g:var(--mythic)}.flip.charge.t-apex .cback{--g:#fff3b0}
@keyframes charge{0%,100%{box-shadow:0 0 10px var(--g)}50%{box-shadow:0 0 38px var(--g),0 0 6px var(--g) inset}}
.opt{transition:transform .35s ease,opacity .35s ease,filter .35s}
.opt.choosable .flip{cursor:pointer}
.opt.choosable:hover{transform:translateY(-8px)}
.opt.kept{transform:translateY(-14px) scale(1.06)}
.opt.kept .card{box-shadow:0 0 30px color-mix(in srgb,var(--c) 70%,transparent)}
.opt.gone{opacity:.18;filter:grayscale(1);transform:scale(.92)}
.hints{display:flex;flex-direction:column;gap:4px;margin-top:8px;opacity:0;transition:opacity .3s}
.opt.revealed .hints{opacity:1}
.hint{font-size:12px;font-weight:800;border-radius:8px;padding:4px 8px;text-align:center}
.hint.new{background:#173320;color:#6ee08c;border:1px solid #2f6b3c}
.hint.dupe{background:#222;color:#aaa;border:1px solid #333}
.hint.set{background:#2a2110;color:#ffcf70;border:1px solid #6b4a1f}
.hint.creator{background:#1b1730;color:#c4b5fd;border:1px solid #4c3d8f}
.hint.mine{background:#331522;color:#ff9ec4;border:1px solid #7a2e4d}
.actions{position:fixed;left:0;right:0;bottom:0;padding:14px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;background:linear-gradient(transparent,rgba(5,4,6,.96) 40%);z-index:51}
.tearing{animation:shake .7s ease both}
@keyframes shake{0%{transform:none}15%{transform:rotate(-3deg)}30%{transform:rotate(3deg)}45%{transform:rotate(-2deg) scale(1.04)}70%{transform:scale(1.1);filter:brightness(1.6)}100%{transform:scale(1.25) translateY(-30px);opacity:0;filter:brightness(2.5)}}

/* feeds, tables */
.feed{display:flex;flex-direction:column;gap:8px}
.feeditem{--c:var(--legendary);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 7%,transparent);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:14px}
.feeditem .tt{font-weight:900;font-size:11px;color:var(--c);min-width:78px;letter-spacing:.5px}
.feeditem.t-mythic{--c:var(--mythic)}.feeditem.t-epic{--c:var(--epic)}.feeditem.t-apex{--c:var(--apex)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
tr.me td{background:rgba(255,179,64,.07)}
.lb tbody tr{cursor:pointer}.lb tbody tr:hover td{background:var(--panel2)}
.scoretbl td{padding:7px 6px}.scoretbl tr.tot td{border-top:2px solid var(--line);border-bottom:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.chip.on{color:#111;background:#f2eef6;border-color:#f2eef6}

/* sets & creators */
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.setbox{border:1px solid var(--line);border-left:5px solid var(--sc,#888);border-radius:10px;padding:12px;background:var(--panel2)}
.setbox.done{background:color-mix(in srgb,var(--sc) 12%,var(--panel2))}
.srew{font-size:13px;margin-top:4px}.srew b.epic{color:#c4a1ff}.srew b.legendary{color:var(--legendary)}
.saway{font-size:13px;font-weight:800;color:var(--accent2)}.sdone{font-size:13px;font-weight:800;color:#6ee08c}
.cicon{width:46px;height:46px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff;overflow:hidden;border:2px solid rgba(255,255,255,.15)}
.cicon img{width:100%;height:100%;object-fit:cover}
.cbox{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2)}
.cbox.done{border-color:#6b4a1f;background:linear-gradient(180deg,rgba(255,179,64,.08),var(--panel2))}
.cbadge{font-size:11px;font-weight:900;letter-spacing:.5px;padding:2px 7px;border-radius:6px;background:#2a2110;color:#ffcf70;border:1px solid #6b4a1f}

/* trades list */
.trade{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--panel2)}
.trade .sides{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
@media (max-width:600px){.trade .sides{grid-template-columns:1fr}}
.status{font-size:12px;font-weight:800;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:#26242c}
.status.accepted{color:#6ee08c}.status.declined,.status.failed,.status.cancelled{color:#ff8080}.status.pending{color:#ffcf70}

/* auth, misc */
.auth{max-width:420px;margin:60px auto}
.auth .field{width:100%;margin-bottom:10px;font-size:16px}
.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs button{flex:1}
.err{color:#ff8a8a;min-height:20px;font-size:14px;margin:6px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f2eef6;color:#111;padding:10px 18px;border-radius:10px;font-weight:700;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.bad{background:#ff8080}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:60;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto}
.modal .card{cursor:default;width:220px;margin:0 auto 10px}
footer{text-align:center;color:#6d6975;font-size:12px;padding:20px;line-height:1.6}
@media (max-width:600px){
  main{padding:14px 10px 60px}.panel{padding:14px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;row-gap:16px}
  .card{padding:6px;border-radius:9px}.card .meta{display:none}.card .pts{left:5px;right:5px;bottom:5px}.card .holotag{left:9px}
  .tpick .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .minis{grid-template-columns:repeat(auto-fill,minmax(50px,1fr))}
  .cstack .many{font-size:14px}
}
</style>
</head>

const TIERS = ['apex','mythic','legendary','epic','rare','uncommon','common'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const app = $('#app');
const fmt = n => Math.round(n).toLocaleString();

// ---- scoring rules (all in one place) ----
const RULES = {
  holoMult: 3,            // a holo level counts 3x
  setMin: 500,            // set bonus = value of its levels, at least this
  creatorMinLevels: 2,    // creators need at least this many levels on the list to count
  creatorHalf: 0.15,      // own half of a creator's levels: +15% of their levels' value
  creatorAll: 0.4,        // own all of them: +40% (total)
  creatorHalfMin: 100, creatorAllMin: 300
};

let sb = null;
if (window.supabase && !/PASTE/.test(CFG.SUPABASE_URL)) sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);

const S = {
  token: localStorage.getItem('gacha_token'),
  me: null, levels: [], byKey: {}, packs: [], creators: [],
  myCards: [], board: [], clock: 0,
  filter: {show: 'all', tier: 'all'}, picks: []
};

async function rpc(name, args) {
  const { data, error } = await sb.rpc(name, args);
  if (error) {
    if (/Not logged in/.test(error.message)) { logoutLocal(); throw new Error('Please log in again'); }
    throw new Error(error.message);
  }
  return data;
}
async function fetchAll(q) {
  let out = [], from = 0;
  while (true) {
    const { data, error } = await q().range(from, from + 999);
    if (error) throw new Error(error.message);
    out = out.concat(data);
    if (data.length < 1000) return out;
    from += 1000;
  }
}
function toast(msg, bad) {
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
function go(h) { location.hash = h; }

// ---------------- data ----------------
const ckey = a => String(a || '').trim().toLowerCase();
async function loadLevels() {
  const lv = await fetchAll(() => sb.from('levels').select('*').order('rank', {ascending: true, nullsFirst: false}));
  S.levels = lv; S.byKey = Object.fromEntries(lv.map(l => [l.key, l]));
  const { data } = await sb.from('list_packs').select('*').order('sort');
  S.packs = data || [];
  // creators: group listed levels by author (case-insensitive)
  const m = {};
  for (const l of lv.filter(l => l.rank && ckey(l.author))) {
    const c = m[ckey(l.author)] ||= {key: ckey(l.author), names: {}, keys: []};
    c.names[l.author] = (c.names[l.author] || 0) + 1; c.keys.push(l.key);
  }
  S.creators = Object.values(m).filter(c => c.keys.length >= RULES.creatorMinLevels).map(c => {
    const name = Object.entries(c.names).sort((a, b) => b[1] - a[1] || (b[0] > a[0] ? 1 : -1))[0][0];
    const value = c.keys.reduce((s, k) => s + S.byKey[k].points, 0);
    return {...c, name, value};
  }).sort((a, b) => b.keys.length - a.keys.length || b.value - a.value);
}
async function loadMyCards() {
  S.myCards = await fetchAll(() => sb.from('cards').select('id,level_key,holo').eq('owner', S.me.user_id).order('id'));
}
async function cardsOf(uid) { return fetchAll(() => sb.from('cards').select('id,level_key,holo').eq('owner', uid).order('id')); }
function setState(st) {
  S.me = st;
  S.clock = new Date(st.server_now).getTime() - Date.now();
  $('#pillCount').textContent = st.packs + st.bonus_packs;
  $('#pillCap').textContent = st.pack_cap;
  $('#who').textContent = st.username;
  $('#navAdmin').classList.toggle('hidden', !st.is_admin);
}
async function refreshState() { setState(await rpc('get_state', {p_token: S.token})); }

function ownership(cards) {
  const o = {};
  for (const c of cards) { const x = o[c.level_key] ||= {count: 0, holo: 0, ids: []}; x.count++; if (c.holo) x.holo++; x.ids.push(c.id); }
  return o;
}
// owned map from leaderboard rows: [[key, holoAny, count]]
function ownFromRows(rows) { const o = {}; for (const [k, h, n] of rows) o[k] = {count: n, holo: h ? 1 : 0}; return o; }

// ---------------- scoring ----------------
function rewardKind(keys) { return keys.some(k => ['apex','mythic','legendary'].includes(S.byKey[k]?.tier)) ? 'legendary' : 'epic'; }
function setValue(keys) { return Math.max(RULES.setMin, keys.reduce((s, k) => s + (S.byKey[k]?.points || 0), 0)); }
function creatorStatus(c, own) {
  const have = c.keys.filter(k => own[k]).length, n = c.keys.length;
  const halfAt = Math.ceil(n / 2);
  const halfBonus = Math.max(RULES.creatorHalfMin, Math.round(c.value * RULES.creatorHalf));
  const allBonus = Math.max(RULES.creatorAllMin, Math.round(c.value * RULES.creatorAll));
  const bonus = have >= n ? allBonus : (n >= 3 && have >= halfAt) ? halfBonus : 0;
  return {c, have, n, halfAt: n >= 3 ? halfAt : null, halfBonus, allBonus, bonus, done: have >= n, missing: c.keys.filter(k => !own[k])};
}
function scoreInfo(own, claimed = []) {
  const byTier = {}; let base = 0, holoBonus = 0, uniq = 0, holos = 0;
  for (const [k, o] of Object.entries(own)) {
    const l = S.byKey[k]; if (!l) continue;
    const t = byTier[l.tier] ||= {n: 0, pts: 0};
    t.n++; t.pts += l.points; base += l.points;
    if (l.rank) uniq++;
    if (o.holo) { holos++; holoBonus += l.points * (RULES.holoMult - 1); }
  }
  const sets = S.packs.map(p => {
    const missing = p.level_keys.filter(k => !own[k]);
    return {p, have: p.level_keys.length - missing.length, missing, done: !missing.length, bonus: setValue(p.level_keys), reward: rewardKind(p.level_keys), claimed: claimed.includes(p.name)};
  });
  sets.sort((a, b) => (b.done && !b.claimed) - (a.done && !a.claimed) || a.done - b.done || a.missing.length - b.missing.length || b.bonus - a.bonus);
  const creators = S.creators.map(c => creatorStatus(c, own));
  const setBonus = sets.filter(x => x.done).reduce((s, x) => s + x.bonus, 0);
  const creatorBonus = creators.reduce((s, x) => s + x.bonus, 0);
  return {byTier, base, holoBonus, setBonus, creatorBonus, uniq, holos, sets, creators,
          setsDone: sets.filter(x => x.done).length, creatorsDone: creators.filter(x => x.done).length,
          total: base + holoBonus + setBonus + creatorBonus};
}
const myInfo = () => scoreInfo(ownership(S.myCards), S.me.claimed_sets || []);
function boardRows() {
  return S.board.map(r => ({...r, info: scoreInfo(ownFromRows(r.owned), r.claimed_sets)})).sort((a, b) => b.info.total - a.info.total);
}

// ---------------- card rendering ----------------
function thumb(l) {
  return l.video_id
    ? `<img loading="lazy" src="https://i.ytimg.com/vi/${esc(l.video_id)}/mqdefault.jpg" alt="" onerror="this.outerHTML='<div class=noimg>'+this.closest('.card').dataset.name+'</div>'">`
    : `<div class="noimg">${esc(l.name)}</div>`;
}
function cardHTML(l, o = {}) {
  if (!l) return '';
  const cls = ['card', 't-' + l.tier, o.holo ? 'holo' : '', o.missing ? 'missing' : '', o.mini ? 'mini' : '', o.sel ? 'sel' : ''].join(' ');
  return `<div class="${cls}" data-key="${esc(l.key)}" data-name="${esc(l.name)}" ${o.id ? `data-id="${o.id}"` : ''}>
    <div class="ctop"><span class="rank">${l.rank ? '#' + l.rank : '—'}</span><span class="tag">${l.rank ? l.tier : 'vaulted'}</span></div>
    <div class="thumb">${thumb(l)}</div>
    <div class="nm">${esc(l.name)}</div>
    <div class="meta">Verified by ${esc(l.verifier || '?')}<br>By ${esc(l.author || '?')}</div>
    <div class="pts">${fmt(l.points * (o.holo ? RULES.holoMult : 1))} pts${o.holo ? ' ✦' : ''}</div>
    ${o.holo ? '<div class="holotag">✦ HOLO</div>' : ''}
  </div>`;
}
// A stack of copies: holos on top, up to 5 layers peeking out above, big count past 5
function stackHTML(l, copies, opts = {}) {
  // copies: [{id, holo}] sorted holos first
  const step = opts.step || 12;
  const shown = copies.slice(0, 5);
  const layers = shown.length;
  let h = `<div class="cstack ${opts.trade ? 'tstack' : ''}" data-key="${esc(l.key)}" style="padding-top:${(layers - 1) * step}px">`;
  // back-most first (highest on screen), front last
  for (let i = layers - 1; i >= 1; i--) {
    const c = shown[i];
    h += `<div class="layer" data-li="${i}" style="top:${(layers - 1 - i) * step}px;z-index:${10 - i}">${cardHTML(l, {holo: c.holo, id: c.id})}</div>`;
  }
  h += `<div class="front layer-front" data-li="0" style="z-index:10">${cardHTML(l, {holo: shown[0].holo, id: shown[0].id})}</div>`;
  if (opts.trade) {   // invisible hit strips so hovering a back card is easy
    for (let i = layers - 1; i >= 1; i--) h += `<div class="hit" data-li="${i}" style="top:${(layers - 1 - i) * step}px;height:${step}px"></div>`;
    h += `<div class="hit" data-li="0" style="top:${(layers - 1) * step}px;bottom:0"></div>`;
  }
  if (copies.length > 5) h += `<div class="many">${copies.length}×</div>`;
  else if (copies.length > 1 && opts.trade) h += `<div class="cnt">${copies.length}×</div>`;
  return h + '</div>';
}
function copiesOf(cards) {   // {key: [{id, holo}] holos first}
  const m = {};
  for (const c of cards) (m[c.level_key] ||= []).push(c);
  for (const k in m) m[k].sort((a, b) => b.holo - a.holo || a.id - b.id);
  return m;
}
function creatorIcon(c) {
  const url = CFG.CREATOR_ICONS[c.key];
  if (url) return `<div class="cicon"><img src="${esc(url)}" alt=""></div>`;
  let h = 0; for (const ch of c.key) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `<div class="cicon" style="background:linear-gradient(135deg,hsl(${h} 60% 45%),hsl(${(h + 40) % 360} 60% 28%))">${esc(c.name.slice(0, 1).toUpperCase())}</div>`;
}

function showLevel(key) {
  const l = S.byKey[key]; if (!l) return;
  const own = ownership(S.myCards)[key];
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box">${cardHTML(l, {holo: own && own.holo})}
    <p><b>${esc(l.name)}</b>: ${l.rank ? `#${l.rank} on the list, ${l.tier.toUpperCase()}` : 'no longer on the list (vaulted)'}<br>
    <span class="muted">Created by ${esc(l.author || '?')} · Verified by ${esc(l.verifier || '?')}</span></p>
    <p>You own: <b>${own ? own.count : 0}</b> ${own && own.holo ? `(${own.holo} holo)` : ''}<br>
    <span class="muted">Worth ${fmt(l.points)} pts, or ${fmt(l.points * RULES.holoMult)} as holo</span></p>

// ---------------- opening & picking ----------------
let busy = false;
async function openPacks(kind, count) {
  if (busy) return; busy = true;
  const top = document.querySelector('.stack .pack:last-child');
  if (top && kind === 'normal') top.classList.add('tearing');
  document.querySelectorAll('main button').forEach(b => b.disabled = true);
  let r;
  try { [r] = await Promise.all([rpc('open_packs', {p_token: S.token, p_kind: kind, p_count: count}), sleep(650)]); }
  catch (e) { busy = false; toast(e.message, true); renderHome(); return; }
  setState(r.state);
  busy = false;
  runPicks(r.picks);
}
async function resumePicks() {
  try { const p = await rpc('my_picks', {p_token: S.token}); if (p.length) runPicks(p); else { await refreshState(); renderHome(); } }
  catch (e) { toast(e.message, true); }
}
// What picking this card would do for you
function pickHints(lk, holo) {
  const own = ownership(S.myCards), l = S.byKey[lk], o = own[lk], hints = [];
  if (!o) hints.push(['new', '✦ NEW']);
  else if (holo && !o.holo) hints.push(['new', '✦ NEW HOLO']);
  else hints.push(['dupe', `Dupe (you have ${o.count})`]);
  if (S.me && ckey(l.author) === ckey(S.me.username)) hints.push(['mine', '★ Your level!']);
  if (!o) {
    for (const p of S.packs) if (p.level_keys.includes(lk)) {
      const miss = p.level_keys.filter(k => !own[k]).length;
      if (miss === 1) hints.push(['set', `Completes ${p.name}!`]);
      else if (miss === 2) hints.push(['set', `1 more for ${p.name}`]);
    }
    const c = S.creators.find(c => c.keys.includes(lk));
    if (c) {
      const st = creatorStatus(c, own);
      if (st.have + 1 === st.n) hints.push(['creator', `Collects ${c.name}!`]);
      else if (st.halfAt && st.have + 1 === st.halfAt) hints.push(['creator', `${c.name} half bonus!`]);
    }
  }
  return hints.map(([c, t]) => `<div class="hint ${c}">${esc(t)}</div>`).join('');
}
function runPicks(picks) {
  if (!picks.length) return;
  let idx = 0;
  const ov = document.createElement('div'); ov.className = 'overlay';
  document.body.appendChild(ov);
  const closeAll = () => { ov.remove(); route(); };
  const showPick = async () => {
    const pk = picks[idx];
    const lv = o => S.byKey[o.level_key];
    const left = picks.length - idx - 1;
    const kindName = pk.kind === 'normal' ? 'Demon ' : pk.kind[0].toUpperCase() + pk.kind.slice(1) + ' ';
    ov.innerHTML = `<div class="inner">
      <div class="muted">${kindName}pack ${picks.length > 1 ? `${idx + 1} of ${picks.length}` : ''}</div>
      <h1 id="pTitle">Revealing…</h1>
      <div class="muted" id="pSub">You can keep one of these ${pk.options.length} cards.</div>
      <div class="pickrow">${pk.options.map((o, i) => `<div class="opt deal" data-i="${i}" style="animation-delay:${i * 130}ms">
        <div class="flip t-${lv(o).tier}"><div class="flip-in"><div class="fr">${cardHTML(lv(o), {holo: o.holo})}</div><div class="cback"><img src="${LOGO}" alt=""></div></div></div>
        <div class="hints">${pickHints(o.level_key, o.holo)}</div></div>`).join('')}</div>
    </div>
    <div class="actions" id="pAct"><button class="btn light" id="revAll">Reveal all</button><button class="btn" id="later">Pick later</button></div>`;
    const opts = [...ov.querySelectorAll('.opt')];
    let skip = false, ready = false;
    const flip = o => { const f = o.querySelector('.flip'); f.classList.remove('charge'); f.classList.add('open'); o.classList.add('revealed'); };
    const allOpen = () => {
      if (ready) return; ready = true;
      opts.forEach(flip);
      ov.querySelector('#pTitle').textContent = 'Pick one to keep';
      ov.querySelector('#pSub').textContent = 'The other cards are lost.';
      ov.querySelector('#pAct').innerHTML = `<button class="btn" id="later">Pick later</button>`;
      ov.querySelector('#later').onclick = closeAll;
      opts.forEach(o => o.classList.add('choosable'));
    };
    ov.querySelector('#revAll').onclick = () => { skip = true; allOpen(); };
    ov.querySelector('#later').onclick = closeAll;
    opts.forEach(o => o.onclick = async () => {
      if (!o.classList.contains('revealed')) { flip(o); if (opts.every(x => x.classList.contains('revealed'))) allOpen(); return; }
      if (!ready || o.dataset.busy) return;
      opts.forEach(x => x.dataset.busy = 1);
      let r;
      try { r = await rpc('pick_card', {p_token: S.token, p_pick_id: pk.id, p_index: +o.dataset.i}); }
      catch (e) { toast(e.message, true); opts.forEach(x => delete x.dataset.busy); return; }
      setState(r.state);
      S.myCards.push({id: r.card.id, level_key: r.card.level_key, holo: r.card.holo});
      opts.forEach(x => { x.classList.remove('choosable'); x.classList.add(x === o ? 'kept' : 'gone'); });
      const l = S.byKey[r.card.level_key];
      ov.querySelector('#pTitle').textContent = `Kept ${l.name}!`;
      ov.querySelector('#pSub').textContent = r.card.is_new ? 'New for your collection ✦' : r.card.is_new_holo ? 'Your first holo of this level ✦' : 'Added to your stack.';
      const packsLeft = pk.kind === 'normal' ? S.me.packs + S.me.bonus_packs : pk.kind === 'epic' ? S.me.epic_packs : S.me.legendary_packs;
      ov.querySelector('#pAct').innerHTML = left
        ? `<button class="btn primary" id="next">Next pack (${left} left)</button><button class="btn light" id="cont">Stop for now</button>`
        : `${packsLeft ? `<button class="btn primary" id="again">Open another (${packsLeft} left)</button>` : ''}<button class="btn light" id="toCol">View collection</button><button class="btn light" id="cont">Continue</button>`;
      ov.querySelector('#cont').onclick = closeAll;
      if (left) ov.querySelector('#next').onclick = () => { idx++; showPick(); };
      else {
        ov.querySelector('#toCol').onclick = () => { ov.remove(); go('#/collection'); route(); };
        if (packsLeft) ov.querySelector('#again').onclick = () => { ov.remove(); renderHome(); openPacks(pk.kind, 1); };
      }
      rpc('leaderboard').then(b => S.board = b).catch(() => {});
    });
    // reveal sequence: worst first, best last; Epic or better glows before flipping
    await sleep(pk.options.length * 130 + 450);
    const order = [...opts].sort((a, b) => TIERS.indexOf(lv(pk.options[b.dataset.i]).tier) - TIERS.indexOf(lv(pk.options[a.dataset.i]).tier));
    for (const o of order) {
      if (skip || ready) return;
      if (o.classList.contains('revealed')) continue;
      const t = TIERS.indexOf(lv(pk.options[o.dataset.i]).tier);
      if (t <= 3) { o.querySelector('.flip').classList.add('charge'); await sleep(1000); }
      if (skip || ready) return;
      flip(o); await sleep(550);
    }
    await sleep(250); allOpen();
  };
  showPick();
}

// ---------------- timer ----------------
setInterval(async () => {
  if (!S.me || !S.me.next_pack_at) return;
  const ms = new Date(S.me.next_pack_at) - (Date.now() + S.clock);
  const t = $('#timer');
  if (ms <= 0) {
    S.me.next_pack_at = null;
    try { await refreshState(); if ((location.hash === '' || location.hash === '#/') && !document.querySelector('.overlay')) renderHome(); } catch {}
    return;
  }
  if (t) { const s = Math.ceil(ms / 1000); t.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
}, 1000);

// ---------------- collection ----------------
function collectionGrid(cards) {
  const cp = copiesOf(cards), f = S.filter;
  let lv = S.levels.filter(l => l.rank || cp[l.key]);
  if (f.tier !== 'all') lv = lv.filter(l => l.tier === f.tier);
  if (f.show === 'owned') lv = lv.filter(l => cp[l.key]);
  if (f.show === 'missing') lv = lv.filter(l => !cp[l.key]);
  if (f.show === 'holo') lv = lv.filter(l => cp[l.key] && cp[l.key].some(c => c.holo));
  if (f.show === 'dupes') lv = lv.filter(l => cp[l.key] && cp[l.key].length > 1);
  return lv.length ? `<div class="grid" style="row-gap:24px">${lv.map(l => cp[l.key] ? stackHTML(l, cp[l.key]) : cardHTML(l, {missing: true})).join('')}</div>` : '<p class="muted">Nothing here.</p>';
}
function filterChips(rerender) {
  const f = S.filter;
  const chip = (grp, v, label) => `<button class="chip ${f[grp] === v ? 'on' : ''}" data-g="${grp}" data-v="${v}">${label}</button>`;
  setTimeout(() => document.querySelectorAll('.chip[data-g]').forEach(b => b.onclick = () => { S.filter[b.dataset.g] = b.dataset.v; rerender(); }));
  return `<div class="chips">${chip('show','all','All')}${chip('show','owned','Owned')}${chip('show','missing','Missing')}${chip('show','holo','✦ Holo')}${chip('show','dupes','Dupes')}</div>
    <div class="chips">${chip('tier','all','Every tier')}${[...TIERS].reverse().map(t => chip('tier', t, t[0].toUpperCase() + t.slice(1))).join('')}</div>`;
}
function renderCollection() {
  const info = myInfo(), listed = S.levels.filter(l => l.rank);
  app.innerHTML = `<div class="panel"><h2>Your collection · ${info.uniq}/${listed.length} · ${S.myCards.length} cards total</h2>
    ${filterChips(renderCollection)}${collectionGrid(S.myCards)}</div>
    <div class="panel"><h2>GDPS pack sets</h2><p class="muted" style="margin-top:-6px">Own every level in a set (normal or holo) to earn its bonus points, plus a one-time reward pack.</p>${setCards(info.sets)}</div>
    <div class="panel"><h2>Your score</h2>${scoreTable(info)}</div>`;
  bindClaims();
}
function renderCreators() {
  const info = myInfo();
  const list = [...info.creators].sort((a, b) => b.done - a.done || (a.n - a.have) - (b.n - b.have) || b.allBonus - a.allBonus);
  app.innerHTML = `<div class="panel"><h2>Creators · ${info.creatorsDone}/${S.creators.length} collected</h2>
    <p class="muted" style="margin-top:-6px">Creators with ${RULES.creatorMinLevels}+ levels on the list. Own half of a creator's levels for a bonus; own all of them to collect the creator for a bigger one.</p>
    ${creatorCards(list.map(x => x))}</div>`;
  // creatorCards hides nothing when list given directly
}

// ---------------- leaderboard / players ----------------
async function renderBoard() {
  app.innerHTML = `<div class="panel"><h2>Leaderboard</h2><p class="muted" style="margin-top:-6px">Harder levels are worth more points. Holos count ${RULES.holoMult}×, plus set and creator bonuses. Dupes don't count, so trade them.</p><div id="lb">Loading…</div></div>`;
  S.board = await rpc('leaderboard');
  const n = S.levels.filter(l => l.rank).length;
  $('#lb').innerHTML = `<table class="lb"><thead><tr><th>#</th><th>Player</th><th>Score</th><th>Unique</th><th>Holo</th><th>Sets</th><th>Creators</th></tr></thead><tbody>
    ${boardRows().map((r, i) => `<tr class="${r.user_id === S.me.user_id ? 'me' : ''}" data-u="${esc(r.username)}"><td><b>${i + 1}</b></td><td><b>${esc(r.username)}</b></td><td>${fmt(r.info.total)}</td><td>${r.info.uniq}/${n}</td><td>${r.info.holos}</td><td>${r.info.setsDone}</td><td>${r.info.creatorsDone}</td></tr>`).join('')}
  </tbody></table>`;
  document.querySelectorAll('tr[data-u]').forEach(tr => tr.onclick = () => go('#/player/' + encodeURIComponent(tr.dataset.u)));
}
async function renderPlayer(name) {
  if (!S.board.length) S.board = await rpc('leaderboard');
  const row = boardRows().find(r => r.username.toLowerCase() === name.toLowerCase());
  if (!row) { app.innerHTML = '<div class="panel">Player not found.</div>'; return; }
  app.innerHTML = '<div class="panel">Loading…</div>';
  const cards = await cardsOf(row.user_id);
  const own = ownership(cards);
  const draw = () => {
    app.innerHTML = `<div class="panel"><div class="row between"><h2 style="margin:0">${esc(row.username)} · ${fmt(row.info.total)} pts</h2>
      ${row.user_id !== S.me.user_id ? `<button class="btn primary sm" id="tw">Trade with ${esc(row.username)}</button>` : ''}</div><br>
      ${filterChips(draw)}${collectionGrid(cards)}</div>
      <div class="panel"><h2>Sets</h2>${setCards(row.info.sets, own, true)}</div>
      <div class="panel"><h2>Score</h2>${scoreTable(row.info)}</div>`;
    const tw = $('#tw'); if (tw) tw.onclick = () => go('#/trades/new/' + encodeURIComponent(row.username));
  };
  draw();
}

// ---------------- trades ----------------
async function renderTrades() {
  app.innerHTML = `<div class="panel"><div class="row between"><h2 style="margin:0">Trades</h2>
    <div class="row"><select class="field" id="pickP"><option value="">Trade with…</option></select><button class="btn primary sm" id="newT">New trade</button></div></div>
    <p class="muted">Both players must agree. Trades are final, so check the cards before accepting.</p><div id="tl">Loading…</div></div>`;
  if (!S.board.length) S.board = await rpc('leaderboard');
  $('#pickP').innerHTML += S.board.filter(r => r.user_id !== S.me.user_id).map(r => `<option>${esc(r.username)}</option>`).join('');
  $('#newT').onclick = () => { const v = $('#pickP').value; if (v) go('#/trades/new/' + encodeURIComponent(v)); else toast('Pick a player first', true); };
  const list = await rpc('my_trades', {p_token: S.token});
  updateTradeDot(list);
  const mini = arr => arr.length ? `<div class="minis nomodal">${arr.map(c => cardHTML(S.byKey[c.level_key], {holo: c.holo, mini: true})).join('')}</div>` : '<span class="muted">nothing</span>';
  $('#tl').innerHTML = list.length ? list.map(t => {
    const youGive = t.incoming ? t.request : t.offer, youGet = t.incoming ? t.offer : t.request;
    const other = t.incoming ? t.from_username : t.to_username;
    return `<div class="trade"><div class="row between">
      <b>${t.incoming ? `From ${esc(other)}` : `To ${esc(other)}`}</b><span class="status ${t.status}">${t.status}</span></div>
      <div class="sides"><div><div class="label">You give</div>${mini(youGive)}</div><div><div class="label">You get</div>${mini(youGet)}</div></div>
      ${t.status === 'pending' ? `<div class="row">${t.incoming ? `<button class="btn primary sm" data-acc="${t.id}">Accept</button><button class="btn sm" data-dec="${t.id}">Decline</button>` : `<span class="muted">Waiting for ${esc(other)}…</span><button class="btn sm" data-dec="${t.id}">Cancel</button>`}</div>` : ''}
    </div>`;
  }).join('') : '<p class="muted">No trades yet.</p>';
  document.querySelectorAll('[data-acc],[data-dec]').forEach(b => b.onclick = async () => {
    const acc = !!b.dataset.acc, id = +(b.dataset.acc || b.dataset.dec);
    if (acc && !confirm('Accept this trade? It can\'t be undone.')) return;
    b.disabled = true;
    try {
      const r = await rpc('respond_trade', {p_token: S.token, p_trade_id: id, p_accept: acc});
      if (r.ok === false) toast(r.message, true); else toast('Trade ' + r.status);
      await loadMyCards(); renderTrades();
    } catch (e) { toast(e.message, true); b.disabled = false; }
  });
}
function updateTradeDot(list) {
  const n = list.filter(t => t.incoming && t.status === 'pending').length;
  $('#navTrades').innerHTML = 'Trades' + (n ? `<span class="dot">${n}</span>` : '');
}
async function renderNewTrade(name) {
  if (!S.board.length) S.board = await rpc('leaderboard');
  const row = S.board.find(r => r.username.toLowerCase() === name.toLowerCase());
  if (!row || row.user_id === S.me.user_id) { app.innerHTML = '<div class="panel">Player not found.</div>'; return; }
  app.innerHTML = '<div class="panel">Loading…</div>';
  const theirs = await cardsOf(row.user_id);
  const give = [], get = [];   // selected card objects
  const myOwn = ownership(S.myCards), theirOwn = ownership(theirs);
  const sortKeys = m => Object.keys(m).sort((a, b) => (S.byKey[a].rank ?? 999) - (S.byKey[b].rank ?? 999));
  const side = (cards, sel) => {
    const cp = copiesOf(cards.filter(c => !sel.some(s => s.id === c.id)));
    return `<div class="grid">${sortKeys(cp).map(k => stackHTML(S.byKey[k], cp[k], {trade: true, step: 30})).join('')}</div>`;
  };
  const tray = (sel, otherOwn) => sel.map(c => cardHTML(S.byKey[c.level_key], {holo: c.holo, id: c.id, mini: true})).join('');
  const draw = () => {
    const ys = [$('#pg')?.scrollTop, $('#pt')?.scrollTop];
    app.innerHTML = `<div class="panel"><div class="row between"><h2 style="margin:0">Trade with ${esc(row.username)}</h2><a href="#/trades">Back</a></div>
      <p class="muted">Hover a stack to slide out a card, click to add it. Click a card in the tray to put it back.</p>
      <div class="tradecols">
        <div><h3>You give (${give.length})</h3><div class="tray" id="tg">${tray(give)}</div></div>
        <div><h3>You get (${get.length})</h3><div class="tray" id="tt">${tray(get)}</div></div>
      </div>
      <div class="row" style="margin:14px 0"><button class="btn primary" id="send" ${give.length + get.length ? '' : 'disabled'}>Send trade offer</button></div>
      <div class="tradecols">
        <div><h3>Your cards</h3><div class="tpick" id="pg">${side(S.myCards, give)}</div></div>
        <div><h3>${esc(row.username)}'s cards</h3><div class="tpick" id="pt">${side(theirs, get)}</div></div>
      </div></div>`;
    if (ys[0] != null) { $('#pg').scrollTop = ys[0]; $('#pt').scrollTop = ys[1]; }
    const bind = (el, cards, sel) => el.querySelectorAll('.tstack').forEach(st => {
      const layerOf = li => st.querySelector(`.layer[data-li="${li}"],.front[data-li="${li}"]`);
      st.querySelectorAll('.hit').forEach(h => {
        h.onmouseenter = () => { st.querySelectorAll('.peek').forEach(x => x.classList.remove('peek')); if (h.dataset.li !== '0') layerOf(h.dataset.li).classList.add('peek'); };
        h.onmouseleave = () => layerOf(h.dataset.li).classList.remove('peek');
        h.onclick = () => {
          const id = +layerOf(h.dataset.li).querySelector('.card').dataset.id;
          const c = cards.find(x => x.id === id); if (c) sel.push(c); draw();
        };
      });
    });
    bind($('#pg'), S.myCards, give); bind($('#pt'), theirs, get);
    $('#tg').querySelectorAll('.card').forEach(c => c.onclick = () => { give.splice(give.findIndex(x => x.id === +c.dataset.id), 1); draw(); });
    $('#tt').querySelectorAll('.card').forEach(c => c.onclick = () => { get.splice(get.findIndex(x => x.id === +c.dataset.id), 1); draw(); });
    $('#send').onclick = async () => {
      $('#send').disabled = true;
      try { await rpc('create_trade', {p_token: S.token, p_to_username: row.username, p_offer: give.map(c => c.id), p_request: get.map(c => c.id)}); toast('Trade offer sent!'); go('#/trades'); }
      catch (e) { toast(e.message, true); $('#send').disabled = false; }
    };
  };
  draw();
}

// ---------------- admin ----------------
function renderAdmin() {
  if (!S.me.is_admin) { go('#/'); return; }
  app.innerHTML = `<div class="panel"><h2>Admin</h2>
    <h3>Sync with the demonlist</h3>
    <p class="muted">Pulls the current list and packs from the GDPS demonlist GitHub. New levels get added, ranks, points and tiers update, and removed levels become "vaulted" (people keep their cards, but they stop dropping).</p>
    <button class="btn primary" id="sync">Sync now</button> <span id="syncMsg" class="muted"></span>
    <hr style="border-color:var(--line);margin:24px 0">
    <h3>Create a code</h3>
    <div class="row"><input class="field" id="cCode" placeholder="CODE"><input class="field" id="cPacks" type="number" value="3" style="width:80px">
      <select class="field" id="cKind"><option value="normal">normal packs</option><option value="epic">epic packs</option><option value="legendary">legendary packs</option></select>
      <input class="field" id="cUses" type="number" value="100" style="width:90px" title="max uses"><button class="btn sm" id="cGo">Create</button></div>
    <p class="muted" style="font-size:13px">The last box is the max number of people who can use it.</p>
    <hr style="border-color:var(--line);margin:24px 0">
    <h3>Reset someone's PIN</h3>
    <div class="row"><input class="field" id="rUser" placeholder="username"><input class="field" id="rPin" placeholder="new PIN" maxlength="4"><button class="btn sm" id="rGo">Reset</button></div>
  </div>`;
  $('#sync').onclick = async () => {
    $('#sync').disabled = true; const msg = $('#syncMsg');
    try {
      msg.textContent = 'Downloading list…';
      const base = CFG.LIST_REPO_RAW;
      const list = await (await fetch(base + '_list.json', {cache: 'no-store'})).json();
      const packs = await (await fetch(base + '_packlist.json', {cache: 'no-store'})).json();
      const vid = u => { const m = String(u || '').match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : null; };
      const levels = [];
      for (let i = 0; i < list.length; i += 10) {
        msg.textContent = `Downloading levels ${i + 1}–${Math.min(i + 10, list.length)} of ${list.length}…`;
        const chunk = await Promise.all(list.slice(i, i + 10).map(async k => {
          const d = await (await fetch(base + encodeURIComponent(k) + '.json', {cache: 'no-store'})).json();
          return {key: k, name: d.name, author: d.author, verifier: d.verifier, video_id: vid(d.verification)};
        }));
        levels.push(...chunk);
      }
      const r = await rpc('admin_sync', {p_token: S.token, p_levels: levels, p_packs: packs.map(p => ({name: p.name, colour: p.colour, levels: p.levels}))});
      await loadLevels();
      msg.textContent = `Done: ${r.levels} levels, ${r.packs} packs.`;
    } catch (e) { msg.textContent = 'Failed: ' + e.message; }
    $('#sync').disabled = false;
  };
  $('#cGo').onclick = async () => {
    try { await rpc('admin_create_code', {p_token: S.token, p_code: $('#cCode').value, p_packs: +$('#cPacks').value, p_kind: $('#cKind').value, p_max_uses: +$('#cUses').value}); toast('Code created: ' + $('#cCode').value.toUpperCase()); }
    catch (e) { toast(e.message, true); }
  };
  $('#rGo').onclick = async () => {
    try { await rpc('admin_reset_pin', {p_token: S.token, p_username: $('#rUser').value, p_new_pin: $('#rPin').value}); toast('PIN reset'); }
    catch (e) { toast(e.message, true); }
  };
}

// ---------------- router / boot ----------------
async function route() {
  if (!S.me) return;
  document.querySelectorAll('.modal').forEach(m => m.remove());
  const h = location.hash || '#/';
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === h || (h.startsWith('#/trades') && a.id === 'navTrades')));
  try {
    if (h.startsWith('#/collection')) renderCollection();
    else if (h.startsWith('#/creators')) renderCreators();
    else if (h.startsWith('#/leaderboard')) await renderBoard();
    else if (h.startsWith('#/player/')) await renderPlayer(decodeURIComponent(h.slice(9)));
    else if (h.startsWith('#/trades/new/')) await renderNewTrade(decodeURIComponent(h.slice(13)));
    else if (h.startsWith('#/trades')) await renderTrades();
    else if (h.startsWith('#/admin')) renderAdmin();
    else renderHome();
  } catch (e) { app.innerHTML = `<div class="panel">Something went wrong: ${esc(e.message)}</div>`; }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
$('#packPill').onclick = () => go('#/');

async function boot() {
  if (!sb) { app.innerHTML = `<div class="panel auth"><h2>Almost there</h2><p>Paste your Supabase URL and key into the CONFIG section at the top of index.html.</p></div>`; return; }
  if (!S.token) { renderAuth(); return; }
  app.innerHTML = '<div class="panel" style="text-align:center">Loading…</div>';
  try {
    await refreshState();
    await Promise.all([loadLevels(), loadMyCards(), rpc('leaderboard').then(b => S.board = b)]);
  } catch (e) {
    if (!S.token) { renderAuth(); return; }
    app.innerHTML = `<div class="panel">Couldn't connect: ${esc(e.message)}</div>`; return;
  }
  $('#top').classList.remove('hidden');
  route();
  rpc('my_trades', {p_token: S.token}).then(updateTradeDot).catch(() => {});
}
setInterval(() => { if (S.token && S.me) rpc('my_trades', {p_token: S.token}).then(updateTradeDot).catch(() => {}); }, 30000);
boot();
</script>
